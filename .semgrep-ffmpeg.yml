#
# Semgrep rules for FFmpeg C sources, run by the c-rules step of
# scripts/upstream_lint.py through scripts/semgrep_scan.sh over changed files.
rules:
  # After ff_rtsp_connect() succeeds, every teardown exit must call ff_network_close()
  # to balance its network init (review of upstream FFmpeg pull request 25618, November 2026).
  - id: ffmpeg-rtsp-connect-failure-without-network-close
    languages: [c]
    severity: ERROR
    message: >-
      ff_rtsp_connect() leaves ff_network_init() active once it succeeds; call
      ff_network_close() after ff_rtsp_close_connections() before returning.
    patterns:
      - pattern-inside: |
          $RET $FUNC(...) {
            ...
            <... ff_rtsp_connect(...) ...>;
            ...
          }
      - pattern: |
          ff_rtsp_close_connections(...);
          ...
          return ...;
      - pattern-not: |
          ff_rtsp_close_connections(...);
          ...
          ff_network_close(...);
          ...
          return ...;

  # Derive pointers after checking allocation results (review of upstream FFmpeg pull request 25480, November 2026):
  # in one function, an allocator call assigns a variable, a NULL-fallback ternary
  # tests a variable of the same name, and a later NULL check tests that name or the
  # ternary destination. Earlier checks never exclude a match, and a reassignment
  # between the allocation and the ternary is not seen, so the tested variable may
  # hold another value. The ternary null test is redundant only when an earlier
  # failure check of the allocation returns or exits; an earlier check that only
  # logs, or no check, leaves the fallback live, and the fix is a failure check that
  # returns the error before deriving pointers. Remove a redundant ternary null test,
  # or retain it with an adjacent rule-specific suppression comment
  # and a semgrep-reason explaining why.
  # No control flow, data flow, macro expansion, alias tracking, or struct-member tracking.
  # Original eight scope pins (syntactic matches, not proof of safety or reachability):
  # - use-before-check: reported by plain shape
  # - log-only-later-check: reported by plain shape
  # - stale-later-check: reported by plain shape
  # - second-ternary: reported by plain shape
  # - conditional-early-check: now reported, without control flow
  # - earlier-allocation-check: now reported, without data flow
  # - goto-into-ternary: now reported, without control flow
  # - unbraced-inner-loop-break: now reported, without control flow
  # Additional pins: macro-assertion-before-ternary, reassigned-buffer-before-ternary,
  # earlier-destination-check, and cast-in-earlier-check are reported by plain shape.
  # Outside the shape: no later check, other function/variable, non-allocator call,
  # no ternary, non-NULL fallback, wrapped ternary, alias-only or member-only checks.
  # Pinned in tests/test_semgrep_rules.py.
  - id: ffmpeg-null-ternary-after-allocation
    languages: [c]
    severity: ERROR
    message: >-
      An allocator call assigns a variable earlier in the function, a
      NULL-fallback ternary tests a variable of the same name, and a later NULL
      check tests that name or the ternary destination.
      A reassignment between the allocation and the ternary is not seen, so the
      tested variable may hold another value.
      The ternary null test is redundant only when an earlier failure check of
      the allocation returns or exits; an earlier check that only logs, or no
      check, leaves the fallback live, and the fix is a failure check that
      returns the error before the pointer is derived.
      Remove a redundant ternary null test, or keep it with a rule-specific
      suppression comment and a semgrep-reason stating why.
      This syntactic rule does not see control flow, data flow, macro
      expansion, aliases, or struct members.
    patterns:
      - pattern-either:
          - pattern-inside: |
              $BUF_TYPE *$BUF = $ALLOC(...);
              ...
              $DST_TYPE *$DST = $TERNARY;
          - pattern-inside: |
              $BUF_TYPE *$BUF = $ALLOC(...);
              ...
              $DST = $TERNARY;
          - pattern-inside: |
              $BUF = $ALLOC(...);
              ...
              $DST_TYPE *$DST = $TERNARY;
          - pattern-inside: |
              $BUF = $ALLOC(...);
              ...
              $DST = $TERNARY;
      - pattern-either:
          - pattern-inside: |
              $DST_TYPE *$DST = $TERNARY;
              ...
              if ($CHECK) {
                ...
              }
          - pattern-inside: |
              $DST = $TERNARY;
              ...
              if ($CHECK) {
                ...
              }
      - metavariable-regex:
          metavariable: $ALLOC
          regex: ^(av_malloc|av_mallocz|av_malloc_array|av_calloc|av_realloc|av_realloc_array|av_memdup|malloc|calloc|realloc)$
      - metavariable-pattern:
          metavariable: $CHECK
          pattern-either:
            - pattern: '!$BUF'
            - pattern: '$BUF == NULL'
            - pattern: 'NULL == $BUF'
            - pattern: '... || !$BUF || ...'
            - pattern: '... || $BUF == NULL || ...'
            - pattern: '... || NULL == $BUF || ...'
            - pattern: '!$DST'
            - pattern: '$DST == NULL'
            - pattern: 'NULL == $DST'
            - pattern: '... || !$DST || ...'
            - pattern: '... || $DST == NULL || ...'
            - pattern: '... || NULL == $DST || ...'
      - pattern-either:
          - pattern: '$DST_TYPE *$DST = $BUF ? $VALUE : NULL;'
          - pattern: '$DST = $BUF ? $VALUE : NULL;'
          - pattern: '$DST_TYPE *$DST = !$BUF ? NULL : $VALUE;'
          - pattern: '$DST = !$BUF ? NULL : $VALUE;'
          - pattern: '$DST_TYPE *$DST = $BUF != NULL ? $VALUE : NULL;'
          - pattern: '$DST = $BUF != NULL ? $VALUE : NULL;'
          - pattern: '$DST_TYPE *$DST = NULL != $BUF ? $VALUE : NULL;'
          - pattern: '$DST = NULL != $BUF ? $VALUE : NULL;'
          - pattern: '$DST_TYPE *$DST = $BUF == NULL ? NULL : $VALUE;'
          - pattern: '$DST = $BUF == NULL ? NULL : $VALUE;'
          - pattern: '$DST_TYPE *$DST = NULL == $BUF ? NULL : $VALUE;'
          - pattern: '$DST = NULL == $BUF ? NULL : $VALUE;'
      - focus-metavariable: $TERNARY
